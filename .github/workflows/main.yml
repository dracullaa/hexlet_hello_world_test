name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest # Указываем операционную систему (Linux)

    steps:
      - name: Checkout repository # Клонирование репозитория
        uses: actions/checkout@v4

      - name: Setup Node.js # Подготовка окружения и установка зависимостей
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm" # ускоряет повторные сборки

      - name: Install dependencies
        run: npm ci # ci (clean install) — правильная команда для CI, она читает package-lock.json

      - name: Run tests # Запуск тестов
        run: npm test

      # Экшен, который выводит строку от Hexlet
      - name: Hello from Hexlet
        uses: hexlet-components/hello-from-hexlet-action@release